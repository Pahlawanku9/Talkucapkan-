name: Build APK Rumah
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Generate gradlew if missing
        run: |
          cd android
          if [ ! -f "./gradlew" ]; then gradle wrapper --gradle-version 8.7; fi
          sed -i 's/gradle-.*-all.zip/gradle-8.7-all.zip/' gradle/wrapper/gradle-wrapper.properties || true
          chmod +x ./gradlew
          cat gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talkucapkan-Rumah
          path: android/app/build/outputs/apk/debug/app-debug.apk
